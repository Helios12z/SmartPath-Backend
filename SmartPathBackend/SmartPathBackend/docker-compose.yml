version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartpath-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: smartpathdb
    ports:
      - "5433:5432"
    volumes:
      - smartpath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smartpathdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    container_name: smartpath-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - smartpath_ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama-init:
    image: ollama/ollama:latest
    container_name: smartpath-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "ollama pull qwen2.5:3b && ollama pull bge-m3"

volumes:
  smartpath_postgres_data:
  smartpath_ollama_data:
