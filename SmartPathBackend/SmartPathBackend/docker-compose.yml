version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartpath-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: smartpathdb
    ports:
      - "5433:5432"
    volumes:
      - smartpath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smartpathdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartpath_postgres_data:
